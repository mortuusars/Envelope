architectury {
    common(rootProject.enabled_platforms.split(","))
}

loom {
    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation("net.fabricmc:fabric-loader:$rootProject.fabric_loader_version")

    api("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}")

    modApi("fuzs.forgeconfigapiport:forgeconfigapiport-common-neoforgeapi:${forge_config_api_port_version}")
    modCompileOnlyApi("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")

    api("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}")

    // Needed for mixins into JEI for advanced compat
    modCompileOnly("mezz.jei:jei-${minecraft_version}-common:${jei_version}")
    modCompileOnly("mezz.jei:jei-${minecraft_version}-lib:${jei_version}")
    modCompileOnly("mezz.jei:jei-${minecraft_version}-gui:${jei_version}")

    modCompileOnly("dev.ryanhcode.sable:sable-common-${minecraft_version}:${sable_version}")

    testImplementation("org.junit.jupiter:junit-jupiter:5.7.1")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

configurations {
    create("junit")
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Makes datagenerated resources usable:
sourceSets {
    main {
        // We are using NeoForge to datagen, and it outputs to the 'common/src/generated' folder
        resources.srcDir file("src/generated")
    }
}